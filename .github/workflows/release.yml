name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Executable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build optimized release binary
        run: cargo build --release

      - name: Verify build with integration test
        shell: pwsh
        run: ./tests/ci_test.ps1 -RdisExe ./target/release/rdis.exe

      - name: Prepare release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/rdis
          Copy-Item target/release/rdis.exe dist/rdis/
          Copy-Item README.md dist/rdis/
          
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "latest" }
          $zipName = "rdis-${tag}-windows-x86_64.zip"
          Compress-Archive -Path dist/rdis/* -DestinationPath "dist/$zipName"
          
          "RELEASE_ZIP=dist/$zipName" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.RELEASE_ZIP }}
            target/release/rdis.exe
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
